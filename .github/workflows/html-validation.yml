name: HTML Game Validation

on:
  push:
    branches: ["feature/html-rebuild"]
  pull_request:
    branches: ["feature/html-rebuild"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run career smoke tests
        run: node tests/smoke.cjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tests/browser-smoke.cjs
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s assets/drag-hero.svg
