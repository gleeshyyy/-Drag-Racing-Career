name: Godot Project Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import project and check scripts
        shell: bash
        run: |
          set -o pipefail
          godot --version
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-import.log; then
            echo "Godot reported project or script errors during import."
            exit 1
          fi

      - name: Launch project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/godot-runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-runtime.log; then
            echo "Godot reported errors while starting the game."
            exit 1
          fi
