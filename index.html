 state.season=state.season||seasonDefaults();state.season.rounds=state.season.rounds||[];const roundAlreadyScored=state.season.rounds.some(r=>r.week===state.season.week);if(!roundAlreadyScored){const roundPoints=won?event.points:label.startsWith('RED')?0:3;state.season.points=(state.season.points||0)+roundPoints;if(!won)state.season.rivalPoints[event.rival]=(state.season.rivalPoints[event.rival]||0)+event.points;state.season.rounds.push({week:state.season.week,event:event.name,rival:event.rival,won,points:roundPoints,et:Number(et.toFixed(3))});}state.cash+=reward;state.level=1+Math.floor(state.reputation/50);const milestones=[{id:'first-win',at:1,bonus:250,points:5},{id:'five-wins',at:5,bonus:750,points:10},{id:'ten-wins',at:10,bonus:1500,points:20}];milestones.forEach(m=>{if(state.wins>=m.at&&!state.milestones.includes(m.id)){state.milestones.push(m.id);state.cash+=m.bonus;state.championshipPoints+=m.points;}});if(!state.bestET||et<state.bestET)state.bestET=et;state.history=state.history||[];state.history.unshift({week:state.week,et:et.toFixed(3),won,label});state.history=state.history.slice(0,8);state.weekly=state.weekly||{races:0,wins:0,quick:0};state.weekly.races++;if(won)state.weekly.wins++;if(et<12.5)state.weekly.quick=1;const weeklyDone=state.weekly.races>=2&&state.weekly.wins>=1&&state.weekly.quick>=1;if(weeklyDone&&!state.weeklyClaimed){state.cash+=400;state.championshipPoints+=10;state.weeklyClaimed=true;}if(state.sponsor){state.sponsorProgress+=won?1:0;if(state.sponsorProgress>=3){state.cash+=500;state.sponsor=null;state.sponsorProgress=0;state.sponsorCompleted=true;state.reputation+=5}}save();const res=document.getElementById('race-result');res.innerHTML=`<strong class="${won?'result-win':'result-loss'}">${label}</strong><div class="result-stats"><div><small>YOUR ET</small><b>${et.toFixed(3)}s</b></div><div><small>REACTION</small><b>${reaction.toFixed(3)}s</b></div><div><small>RIVAL ET</small><b>${rivalEt?rivalEt.toFixed(3)+'s':'—'}</b></div><div><small> function repair(){if(state.cash<250)return;state.cash-=250;state.condition=100;save();renderGarage()}
function renderManagement(){const hasOffer=!state.sponsor&&!state.sponsorCompleted&&state.reputation>=10;screen.innerHTML=`<div class="section-head"><div><div class="eyebrow">CAREER OFFICE</div><h2>MANAGEMENT</h2><p>Build a stable career beyond the finish line.</p></div><button class="button small" data-go="dashboard">BACK</button></div><div class="dashboard-grid"><div class="panel panel-pad"><div class="eyebrow">PERSONAL FINANCES</div><div class="stat cash"><label>AVAILABLE CASH</label><strong>${money(state.cash)}</strong></div><p style="color:#9bb0c1">Your cash reserve pays for race entries, repairs and upgrades.</p></div><div class="panel panel-pad"><div class="eyebrow">CAREER RECORD</div><div class="stat-grid"><div class="stat"><label>EVENTS ENTERED</label><strong>${state.races}</strong></div><div class="stat"><label>WIN RATE</label><strong>${state.races?Math.round(state.wins/state.races*100):0}%</strong></div><div class="stat"><label>BEST QUARTER-MILE</label><strong>${state.bestET?state.bestET.toFixed(2)+'s':'—'}</strong></div><div class="stat"><label>SPONSOR</label><strong>${state.sponsor?'ACTIVE':'NONE'}</strong></div></div></div></div><div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">FAMILY RESPONSIBILITY · MONTHLY</div><div class="service-row"><div><b>COURT-ORDERED CHILD SUPPORT</b><small>${money(state.childSupport)} due every four weeks · Next due at end of Week ${(Math.floor((state.week-1)/4)+1)*4}</small></div><strong>${money(state.childSupport)}/MONTH</strong></div><div class="service-row"><div><b>OUTSTANDING ARREARS</b><small>Total support paid: ${money(state.childSupportPaid||0)}</small></div><strong>${money(state.childSupportArrears||0)}</strong></div><button class="button amber full" id="pay-child-support" ${(state.cash<=0||!(state.childSupportArrears>0))?'disabled':''}>PAY OUTSTANDING SUPPORT</button><p class="challenge-note">If the automatic payment is missed, the balance carries forward until you pay it.</p></div>${state.sponsor?'<div class="event-unlock"><b>'+esc(state.sponsor)+'</b><span>Contract progress: '+state.sponsorProgress+'/3 race wins · Completion bonus '+money(500)+'</span></div>':hasOffer?'<div class="panel panel-pad sponsor-panel"><div class="eyebrow">SPONSOR INTEREST</div><h2 style="font:800 32px Barlow Condensed;margin:5px 0">NITROLINE PERFORMANCE</h2><p style="color:#a9bac8">They noticed your results. Win three races and collect a ${money(500)} contract bonus, plus 5 reputation.</p><button class="button primary" id="accept-sponsor">SIGN SPONSOR CONTRACT</button></div>':state.sponsorCompleted?'<div class="event-unlock"><b>NITROLINE CONTRACT COMPLETED</b><span>Contract reward collected. Your sponsor record is saved.</span></div>':'<div class="empty-note">Reach 10 reputation to attract your first sponsor.</div>'}<div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">WEEKLY CHALLENGES · WEEK ${state.week}</div><div class="challenge-row"><div><b>DOUBLE DOWN</b><small>Complete 2 races this week</small></div><strong>${Math.min(2,(state.weekly||{}).races||0)}/2</strong></div><div class="challenge-row"><div><b>TAKE THE FLAG</b><small>Win at least 1 race this week</small></div><strong>${Math.min(1,(state.weekly||{}).wins||0)}/1</strong></div><div class="challenge-row"><div><b>QUICK QUARTER</b><small>Record a run under 12.50 seconds</small></div><strong>${Math.min(1,(state.weekly||{}).quick||0)}/1</strong></div><p class="challenge-note">${state.weeklyClaimed?'WEEKLY BONUS CLAIMED':'Complete all three challenges for a $400 bonus and 10 championship points.'}</p></div><div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">CHAMPIONSHIP STANDINGS</div><div class="standings-row"><b>${esc(state.driver)}</b><strong>${state.championshipPoints||0} PTS</strong></div>${EVENTS.map(ev=>`<div class="standings-row"><span>${ev.rival}</span><strong>${(state.rivalWins||{})[ev.rival]||0} WINS</strong></div>`).join('')}</div><div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">CAREER MILESTONES</div>${(state.milestones||[]).length?(state.milestones||[]).map(id=>`<div class="service-row"><b>${id==='first-win'?'FIRST VICTORY':id==='five-wins'?'FIVE-TIME WINNER':'STRIP REGULAR'}</b><strong>CLAIMED</strong></div>`).join(''):'<p style="color:#91a5b7">Win races to unlock cash and championship-point bonuses.</p>'}</div>${renderSeasonPanel()}<div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">WEEKLY ROUTINE</div><p style="color:#a9bac8">Advance the calendar when ready. Living costs are ${money(100)} per week.</p><button class="button amber" id="end-week">END WEEK · ADVANCE TO WEEK ${state.week+1}</button></div><div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">RECENT RACE RESULTS</div>${(state.history||[]).length?state.history.map(r=>'<div class="service-row"><div><b>'+esc(r.label)+'</b><small>WEEK '+r.week+' · ET '+r.et+'s</small></div><strong>'+(r.won?'WIN':'LOSS')+'</strong></div>').join(''):'<p style="color:#8fa4b6">Your completed races will appear here.</p>'}</div>`;}
function renderSeasonPanel(){const season=state.season||seasonDefaults();return '<div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">SEASON '+season.number+' · ROUND '+season.week+'/'+SEASON_LENGTH+'</div><h2 style="font:800 28px Barlow Condensed;margin:6px 0">CHAMPIONSHIP CALENDAR</h2><p style="color:#a9bac8">Eight rounds decide the season title. A win earns full event points; a completed run earns 3 points. Champion reward: $5,000 and 20 reputation.</p><div class="season-calendar">'+SEASON_ROUNDS.map((eventIndex,i)=>{const event=EVENTS[eventIndex],round=season.rounds.find(r=>r.week===i+1),current=season.week===i+1;return '<div class="season-round '+(round?'done ':'')+(current?'current':'')+'"><small>ROUND '+(i+1)+(round?' · COMPLETE':current?' · CURRENT':'')+'</small><b>'+event.name+'</b><span>Rival: '+event.rival+'</span><span>'+(round?(round.forfeit?'FORFEIT':round.won?'WIN':'RUN')+' · '+round.points+' PTS':'Winner: '+event.points+' PTS')+'</span></div>'}).join('')+'</div></div><div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">SEASON '+season.number+' STANDINGS</div><div class="standings-row"><b>'+esc(state.driver)+'</b><strong>'+season.points+' PTS</strong></div>'+Object.entries(season.rivalPoints).sort((a,b)=>b[1]-a[1]).map(([name,points])=>'<div class="standings-row"><span>'+name+'</span><strong>'+points+' PTS</strong></div>').join('')+'</div>'+(season.history.length?'<div class="panel panel-pad" style="margin-top:16px"><div class="eyebrow">PAST SEASON CHAMPIONS</div>'+season.history.map(h=>'<div class="service-row"><div><b>SEASON '+h.number+' · '+esc(h.champion)+'</b><small>'+h.points+' championship points</small></div><strong>'+money(h.reward)+'</strong></div>').join('')+'</div>':'')}
function payChildSupport(){const due=Math.max(0,state.childSupportArrears||0);const payment=Math.min(state.cash,due);if(!payment)return;state.cash-=payment;state.childSupportArrears=due-payment;state.childSupportPaid=(state.childSupportPaid||0)+payment;save();renderManagement()}
function acceptSponsor(){if(state.sponsor)return;state.sponsor='NITROLINE PERFORMANCE';state.sponsorProgress=0;save();renderManagement()}
function endWeek(){const completedWeek=state.week;state.season=state.season||seasonDefaults();state.season.rounds=state.season.rounds||[];if(!state.season.rounds.some(r=>r.week===state.season.week)){const missed=currentSeasonEvent();state.season.rivalPoints[missed.rival]=(state.season.rivalPoints[missed.rival]||0)+missed.points;state.season.rounds.push({week:state.season.week,event:missed.name,rival:missed.rival,won:false,points:0,et:null,forfeit:true});}state.week++;state.cash=Math.max(0,state.cash-100);if(completedWeek%4===0){const due=(state.childSupport||200)+(state.childSupportArrears||0);const paid=Math.min(state.cash,due);state.cash-=paid;state.childSupportPaid=(state.childSupportPaid||0)+paid;state.childSupportArrears=due-paid;}state.weekly={races:0,wins:0,quick:0};state.weeklyClaimed=false;selectedEvent=0;state.season=state.season||seasonDefaults();if(state.season.week>=SEASON_LENGTH){const standings=[{name:state.driver,points:state.season.points||0},...Object.entries(state.season.rivalPoints||{}).map(([name,points])=>({name,points}))].sort((a,b)=>b.points-a.points);const champion=standings[0];const reward=champion.name===state.driver?5000:1000;if(champion.name===state.driver){state.cash+=reward;state.reputation+=20;state.championshipPoints+=50}else state.cash+=reward;state.season.history=state.season.history||[];state.season.history.unshift({number:state.season.number,champion:champion.name,points:champion.points,reward});state.season.history=state.season.history.slice(0,5);const finished=state.season.number;state.season.number++;state.season.week=1;state.season.points=0;state.season.rivalPoints={Jax:0,Viper:0,Rex:0};state.season.rounds=[];alert('SEASON COMPLETE — '+champion.name+' wins Season '+finished+'! '+(champion.name===state.driver?'Champion reward: '+money(reward)+' and 20 reputation.':'Your season reward: '+money(reward)+'.'));}else state.season.week++;save();renderDashboard()}
function renderStory(){
 state.storyFlags=state.storyFlags||{};state.storyLog=state.storyLog||[];
 const chapters=[
 {id:'jasper',title:'JASPER OPENS A DOOR',tag:'CHAPTER 01 · THE FIRST CONNECTION',unlock:true,body:'Jasper meets you behind a closed workshop. He knows the street scene, but warns that reputation is earned one run at a time. He can introduce you to underground racers or help you pursue the legal rookie circuit.',choices:[['street','ENTER THE STREET SCENE','You take Jasper’s underground introduction. Your path is set.'],['rookie','ASK ABOUT LEGAL TRACKS','You ask Jasper to connect you with sanctioned rookie events.']]},
 {id:'jax',title:'JAX WANTS A REMATCH',tag:'CHAPTER 02 · A RIVAL TAKES NOTICE',unlock:state.races>=2||state.week>=2,body:'Jax catches you near the staging lanes. He says your first results were no fluke — or a lucky night. He wants to see whether you can keep your nerve.',choices:[['jax-respect','ACCEPT THE CHALLENGE','You agree to settle it on the strip. Jax will remember your answer.'],['jax-ignore','WALK AWAY','You refuse to be pulled into Jax’s games.']]},
 {id:'viper',title:'VIPER’S PROPOSITION',tag:'CHAPTER 03 · TRUST HAS A PRICE',unlock:state.reputation>=20,body:'Viper has been watching your progress. They offer to exchange setup knowledge, but expect you to spend money on parts and trust them with your tuning approach.',choices:[['viper-share','SHARE TUNING KNOWLEDGE','Spend $150. Gain 10 HP from the shared setup.'],['viper-private','KEEP YOUR SETUP PRIVATE','Protect your build and earn 3 reputation for standing your ground.']]},
 {id:'rex',title:'REX CALLS YOU OUT',tag:'CHAPTER 04 · THE REGIONAL STAGE',unlock:state.reputation>=60,body:'Rex sends a message: the regional proving ground is where serious drivers prove themselves. He offers no shortcuts and expects you to show up ready.',choices:[['rex-commit','COMMIT TO THE CHAMPIONSHIP','Add 10 championship points and mark the regional commitment.'],['rex-cash','FOCUS ON THE GARAGE','Take a $300 preparation grant instead of committing today.']]}
 ];
 const log=state.storyLog.length?state.storyLog.slice().reverse().map(x=>'<div class="story-log-row"><b>'+esc(x.title)+'</b><span>'+esc(x.result)+'</span></div>').join(''):'<p class="story-muted">Your important career decisions will be recorded here.</p>';
 screen.innerHTML='<div class="section-head"><div><div class="eyebrow">CAREER JOURNAL · WEEK '+state.week+'</div><h2>STORY & CONTACTS</h2><p>People remember your choices. Some doors only open once.</p></div><button class="button small" data-go="dashboard">BACK TO PADDOCK</button></div>'+
 '<div class="story-intro panel"><div class="panel-pad"><div class="eyebrow">YOUR STORY SO FAR</div><p class="story-copy"><strong>'+esc(state.driver)+'</strong> lost a job after company restructuring. The marriage ended, your former partner received custody of your child, and court-ordered support became another responsibility. With Jasper’s help, you are trying to rebuild your life through racing.</p><div class="story-contact-strip"><span>JASPER · YOUR FRIEND</span><span>JAX · STREET RIVAL</span><span>VIPER · TUNING SPECIALIST</span><span>REX · REGIONAL CHAMPION</span></div></div></div>'+
 chapters.map(ch=>{const done=!!state.storyFlags[ch.id];return '<section class="story-chapter panel '+(done?'completed':'')+'"><div class="panel-pad"><div class="eyebrow">'+ch.tag+'</div><h3>'+ch.title+'</h3><p>'+ch.body+'</p>'+(done?'<div class="story-choice-done">DECISION RECORDED</div>':ch.unlock?'<div class="story-choice-list">'+ch.choices.map(choice=>'<button class="story-choice" data-story-choice="'+choice[0]+'"><b>'+choice[1]+'</b><small>'+choice[2]+'</small></button>').join('')+'</div>':'<div class="story-locked">NOT YET AVAILABLE · KEEP RACING TO UNLOCK THIS CHAPTER</div>')+'</div></section>'}).join('')+
 '<section class="panel panel-pad story-log"><div class="eyebrow">DECISION HISTORY</div>'+log+'</section>';
}
function applyStoryChoice(choice){
 state.storyFlags=state.storyFlags||{};state.storyLog=state.storyLog||[];
 const choices={
 street:{chapter:'jasper',title:'Jasper’s underground introduction',result:'Chose the Street Underground route.',apply:()=>{state.path='Street Underground';state.reputation+=2;}},
 rookie:{chapter:'jasper',title:'Jasper’s legal-track connection',result:'Chose the Rookie League route.',apply:()=>{state.path='Rookie League';state.cash+=150;}},
 'jax-respect':{chapter:'jax',title:'Jax’s rematch',result:'Accepted Jax’s challenge.',apply:()=>{state.reputation+=2;state.cash+=100;}},
 'jax-ignore':{chapter:'jax',title:'Jax’s rematch',result:'Declined Jax’s challenge.',apply:()=>{}},
 'viper-share':{chapter:'viper',title:'Viper’s tuning proposition',result:'Shared tuning knowledge and paid $150.',apply:()=>{if(state.cash<150){alert('You need $150 to accept this deal.');return false;}state.cash-=150;state.carPower+=10;state.vehiclePower=state.vehiclePower||{};state.vehiclePower[state.car]=state.carPower;}},
 'viper-private':{chapter:'viper',title:'Viper’s tuning proposition',result:'Kept the setup private and gained 3 reputation.',apply:()=>{state.reputation+=3;}},
 'rex-commit':{chapter:'rex',title:'Rex’s regional callout',result:'Committed to the regional championship.',apply:()=>{state.championshipPoints=(state.championshipPoints||0)+10;}},
 'rex-cash':{chapter:'rex',title:'Rex’s regional callout',result:'Took a $300 preparation grant.',apply:()=>{state.cash+=300;}}
 };
 const item=choices[choice];if(!item||state.storyFlags[item.chapter])return;
 if(item.apply()===false)return;
 state.storyFlags[item.chapter]=true;state.storyLog.push({title:item.title,result:item.result});save();renderStory();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}const gender=e.target.closest('[data-gender]');if(gender){document.querySelectorAll('[data-gender]').forEach(b=>b.classList.remove('active'));gender.classList.add('active');return}if(e.target.closest('#begin-career'))startCareer();if(e.target.closest('#camera-toggle'))toggleRaceCamera();if(e.target.closest('#stage-race'))stageRace();if(e.target.closest('#launch-car')){if(shiftState)shiftGear();else launchRace()}const ev=e.target.closest('[data-event]');if(ev&&!ev.disabled){selectedEvent=Number(ev.dataset.event);renderRacing()}const car=e.target.closest('[data-car]');if(car)buyCar(car.dataset.car);if(e.target.closest('#upgrade-car'))upgrade();if(e.target.closest('#repair-car'))repair();if(e.target.closest('#accept-sponsor'))acceptSponsor();if(e.target.closest('#pay-child-support'))payChildSupport();if(e.target.closest('#end-week'))endWeek();const storyChoice=e.target.closest('[data-story-choice]');if(storyChoice)applyStoryChoice(storyChoice.dataset.storyChoice)});
go('home');

</script>
</body>
</html>
